name: Build Nexo AppImage

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config gcc g++ libgtk-4-dev libwebkitgtk-6.0-dev librsvg2-dev patchelf file xvfb imagemagick

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --parallel

      - name: Prepare AppDir
        run: |
          set -euo pipefail
          rm -rf AppDir
          DESTDIR="$PWD/AppDir" cmake --install build
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps AppDir/usr/share/applications
          cp packaging/nexo.desktop AppDir/usr/share/applications/nexo.desktop
          cp packaging/icons/nexo.svg AppDir/usr/share/icons/hicolor/scalable/apps/nexo.svg
          test -x AppDir/usr/bin/nexo

          process_dir="$(dirname "$(find /usr -type f -name WebKitWebProcess -print -quit)")"
          test -n "$process_dir"
          test -x "$process_dir/WebKitWebProcess"
          mkdir -p AppDir/usr/lib/x86_64-linux-gnu/webkitgtk-6.0/injected-bundle
          cp -a "$process_dir/WebKitWebProcess" AppDir/usr/lib/x86_64-linux-gnu/webkitgtk-6.0/
          cp -a "$process_dir/WebKitNetworkProcess" AppDir/usr/lib/x86_64-linux-gnu/webkitgtk-6.0/
          if [ -x "$process_dir/WebKitGPUProcess" ]; then
            cp -a "$process_dir/WebKitGPUProcess" AppDir/usr/lib/x86_64-linux-gnu/webkitgtk-6.0/
          fi
          if [ -f "$process_dir/injected-bundle/libwebkitgtkinjectedbundle.so" ]; then
            cp -a "$process_dir/injected-bundle/libwebkitgtkinjectedbundle.so" AppDir/usr/lib/x86_64-linux-gnu/webkitgtk-6.0/injected-bundle/
          fi
          test -x AppDir/usr/lib/x86_64-linux-gnu/webkitgtk-6.0/WebKitWebProcess
          test -x AppDir/usr/lib/x86_64-linux-gnu/webkitgtk-6.0/WebKitNetworkProcess

      - name: Native WebView smoke test
        run: |
          set -euo pipefail
          export NEXO_SMOKE_TEST=1
          export GDK_BACKEND=x11
          export GTK_A11Y=none
          export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          set +e
          timeout 8s xvfb-run -a ./AppDir/usr/bin/nexo 2>&1 | tee native-smoke.log
          rc=${PIPESTATUS[0]}
          set -e
          # Nexo's real Google navigation is intentionally not the CI gate:
          # network/TLS/Google response time is outside the WebView startup test.
          # The visual smoke test below is the real rendering gate.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            cat native-smoke.log
            exit "$rc"
          fi
          grep -q 'Nexo' native-smoke.log

      - name: Install linuxdeploy and appimagetool
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-delay 2 -o linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L --fail --retry 4 --retry-delay 2 -o appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy.AppImage appimagetool.AppImage
          ./linuxdeploy.AppImage --version
          ./appimagetool.AppImage --version || true

      - name: Bundle AppDir dependencies
        env:
          NO_STRIP: 1
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          set -euo pipefail
          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/nexo.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/nexo.svg \
            --executable AppDir/usr/bin/nexo

          python3 - <<'PY'
          from pathlib import Path
          old = b"/usr/lib/x86_64-linux-gnu/webkitgtk-6.0"
          new = b"/tmp/.nexo-appimage.dir/webkitgtk-6.0xx"
          assert len(old) == len(new), (len(old), len(new))
          lib = Path("AppDir/usr/lib/libwebkitgtk-6.0.so.4")
          data = lib.read_bytes()
          count = data.count(old)
          assert count >= 1, f"WebKit helper path not found in {lib}"
          lib.write_bytes(data.replace(old, new))
          print(f"Patched {count} WebKitGTK helper path(s)")
          PY

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          set -eu
          HERE="$(CDPATH= cd -- "$(dirname -- "$(readlink -f -- "$0")")" && pwd)"
          export APPDIR="$HERE"
          if [ -d "$HERE/usr/lib/x86_64-linux-gnu/gio/modules" ]; then
            export GIO_MODULE_DIR="$HERE/usr/lib/x86_64-linux-gnu/gio/modules"
          elif [ -d "$HERE/usr/lib/gio/modules" ]; then
            export GIO_MODULE_DIR="$HERE/usr/lib/gio/modules"
          fi
          export GTK_A11Y=none
          export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          mkdir -p /tmp/.nexo-appimage.dir
          ln -sfn "$HERE/usr/lib/x86_64-linux-gnu/webkitgtk-6.0" /tmp/.nexo-appimage.dir/webkitgtk-6.0xx
          exec "$HERE/usr/bin/nexo" "$@"
          EOF
          chmod +x AppDir/AppRun
          test -x AppDir/AppRun
          test -x AppDir/usr/lib/x86_64-linux-gnu/webkitgtk-6.0/WebKitWebProcess
          test -x AppDir/usr/lib/x86_64-linux-gnu/webkitgtk-6.0/WebKitNetworkProcess

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          set -euo pipefail
          ./appimagetool.AppImage AppDir Nexo-x86_64.AppImage
          test -s Nexo-x86_64.AppImage
          file Nexo-x86_64.AppImage

      - name: AppImage real WebView smoke test
        run: |
          set -euo pipefail
          export NEXO_SMOKE_TEST=1
          export GDK_BACKEND=x11
          export GTK_A11Y=none
          export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          set +e
          timeout 12s xvfb-run -a ./Nexo-x86_64.AppImage 2>&1 | tee appimage-smoke.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            cat appimage-smoke.log
            exit "$rc"
          fi
          grep -q 'Nexo' appimage-smoke.log

      - name: Visual smoke test screenshot
        run: |
          set -euo pipefail
          export GDK_BACKEND=x11
          export GTK_A11Y=none
          export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          xvfb-run -a sh -c 'timeout 15s ./Nexo-x86_64.AppImage >/tmp/nexo-visual.log 2>&1 & pid=$!; sleep 7; import -window root nexo-webview-screen.png || true; kill $pid 2>/dev/null || true; wait $pid 2>/dev/null || true'
          test -s nexo-webview-screen.png
          # The lower part is the browser viewport. Reject an all-white/all-black
          # render so a missing WebKit surface cannot silently pass CI.
          convert nexo-webview-screen.png -crop 1280x700+0+100 -colorspace Gray -format '%[fx:mean]\n' info: > viewport-mean.txt
          awk '{ if ($1 <= 0.01 || $1 >= 0.99) exit 1 }' viewport-mean.txt

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: nexo-diagnostics
          path: |
            nexo-webview-screen.png
            native-smoke.log
            appimage-smoke.log
            viewport-mean.txt
          if-no-files-found: error

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: nexo-appimage
          path: Nexo-x86_64.AppImage
          if-no-files-found: error
